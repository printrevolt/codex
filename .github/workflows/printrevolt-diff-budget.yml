name: printrevolt-diff-budget

on:
  pull_request:
    paths:
      - "codex-rs/**"

jobs:
  diff-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check diff budget
        run: |
          bash scripts/printrevolt_diff_budget.sh
