[package]
name = "codex-pr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_pr_cli"
path = "src/lib.rs"

[[bin]]
name = "codex-pr"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-pr-config = { path = "../pr_config" }
codex-pr-repo-ops = { path = "../pr_repo_ops" }
codex-pr-templates = { path = "../pr_templates" }
codex-pr-types = { path = "../pr_types" }
codex-pr-updater = { path = "../pr_updater" }
codex-pr-advisor = { path = "../pr_advisor" }
codex-pr-pipelines = { path = "../pr_pipelines" }
codex-pr-workflows = { path = "../pr_workflows" }
codex-pr-runtime = { path = "../pr_runtime" }
codex-utils-home-dir = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
